{{- if .Values.app.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: sample-app
spec:
  replicas: {{ .Values.app.replicas }}
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
        tenant: {{ .Release.Namespace }}
    spec:
      # karpenter NodePool(tenant)이 만든 노드에만
      nodeSelector:
        workload: tenant
      containers:
        - name: web
          image: {{ .Values.app.image }}
          ports:
            - containerPort: 8080
          # quota 걸려있어서 requests/limits 없으면 파드 생성 거부됨
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: sample-app
  ports:
    - port: 80
      targetPort: 8080
{{- end }}
